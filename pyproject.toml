[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ofdm-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "torch>=2.9.1", "sionna==2.2.0", "requests"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
